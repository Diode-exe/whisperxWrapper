[project]
name = "whisperxwrapper"
version = "0.1.0"
description = "Simple wrapper for the whisperx library to make it easier to use."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "whisperx>=3.3.1",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "setuptools<81",
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-xpu", marker = "sys_platform == 'win32'" }
]
torchvision = [
  { index = "pytorch-xpu", marker = "sys_platform == 'win32'" }
]
torchaudio = [
  { index = "pytorch-xpu", marker = "sys_platform == 'win32'" }
]